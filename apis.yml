aid: signiant
name: Signiant
description: >-
  Signiant provides intelligent file-movement software that helps the world's
  top content creators and distributors move large files fast and securely over
  public and private networks. The SaaS Signiant Platform unifies four products
  behind a common OAuth-secured REST API: the Signiant Platform API (storage,
  endpoints, users, and roles across products), Jet (automated system-to-system
  transfers with event webhooks), Media Shuttle (person-initiated transfers with
  Platform, Management, and System-to-Person APIs plus a browser SDK), and
  Flight Deck (the Manager REST API for scheduling and running jobs). All APIs
  authenticate with a client_id/client_secret pair exchanged for a one-hour
  OAuth 2.0 JWT bearer token at platform-api-service.services.cloud.signiant.com,
  and access is governed by product-scoped account roles.
